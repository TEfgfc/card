<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人网页导航 | 黄珈伦</title>
    <meta name="description" content="黄珈伦的个人导航星图，快速访问数字名片的各个板块。">
    <style>
        /* ==========================================================
           配色变量：想换颜色只改这里
           设计原则：金色为主强调色，紫色为辅助，不再引入第三种强调色
           ========================================================== */
        :root {
            --bg-dark: #06060c;      /* 深空底色：比纯黑更柔和的深蓝黑 */
            --gold: #e8c97a;         /* 金色（主强调色）：节点、标题、轨道起点 */
            --gold-dim: rgba(232, 201, 122, 0.2);  /* 金色低透明度：边框、阴影 */
            --purple: #9d6ff0;       /* 紫色（辅助色）：旗帜装饰、轨道终点 */
            --text-main: #e8ecf8;    /* 主要文字 */
            --text-sub: #8b93a8;     /* 次要文字 */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;           /* 全屏星图，不允许滚动 */
            color: var(--text-main);
            min-height: 100dvh;        /* 移动端安全的视口高度 */
        }

        /* 减弱动画：尊重系统设置，关闭所有装饰性动画 */
        @media (prefers-reduced-motion: reduce) {
            body::before,
            .rail-line,
            .node,
            .header-title { animation: none !important; transition: none !important; }
            .rail-line { stroke-dasharray: none; }
        }

        /* ==========================================================
           多层背景层级（从底到顶）：
           body::before 星云(-3)
           → #star-canvas 星星(-2)
           → body::after 天体(-1)
           → #app 内容(1)
           ========================================================== */

        /* 星云：柔和的紫色光雾缓慢漂移 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(157, 111, 240, 0.25) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(232, 201, 122, 0.08) 0%, transparent 50%);
            filter: blur(80px);
            animation: nebulaDrift 25s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes nebulaDrift {
            0%   { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.05) translate(-1%, 1%); }
        }

        /* 天体：右上角的巨大星球轮廓 */
        body::after {
            content: '';
            position: fixed;
            top: -25vh; right: -15vw;
            width: 65vw; height: 65vw;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(157, 111, 240, 0.15), transparent 65%);
            box-shadow:
                inset -30px -30px 120px rgba(0, 0, 0, 0.6),
                0 0 100px rgba(157, 111, 240, 0.08);
            z-index: -1;
            pointer-events: none;
        }

        /* 星尘画布 */
        #star-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100dvh;
            z-index: -2;
            pointer-events: none;
        }

        #app {
            position: relative;
            width: 100vw; height: 100dvh;
            z-index: 1;
        }

        /* 全息网格：极淡的金色调，与主色统一 */
        #app::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(rgba(232, 201, 122, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(232, 201, 122, 0.02) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }

        /* SVG 轨道层 */
        #rail-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* ==========================================================
           轨道：金色渐变 + 流光虚线
           ========================================================== */
        .rail-line {
            fill: none;
            stroke: url(#rail-gradient);
            stroke-width: 1.5;
            stroke-dasharray: 6, 14;
            animation: flow 2s linear infinite;
            filter: drop-shadow(0 0 4px rgba(232, 201, 122, 0.4));
        }

        @keyframes flow { to { stroke-dashoffset: -20; } }

        .rail-orb {
            fill: #f5e6b8;
            filter: drop-shadow(0 0 5px rgba(232, 201, 122, 0.9));
        }

        #nodes-container {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }

        /* ==========================================================
           节点：玻璃拟态卡片
           ========================================================== */
        .node {
            position: absolute;
            width: 180px;
            padding: 14px 16px;
            background: rgba(12, 12, 24, 0.8);
            border: 1px solid var(--gold-dim);
            border-radius: 10px;
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            /* 内描边：模拟玻璃边缘折射高光 */
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                inset 0 0 20px rgba(232, 201, 122, 0.03),
                0 4px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-color 0.25s ease,
                        box-shadow 0.25s ease,
                        background-color 0.25s ease;
            cursor: pointer;
            text-align: center;
            transform: translate(-50%, -50%);
            /* 可聚焦：键盘用户能看到焦点环 */
        }

        .node:hover {
            transform: translate(-50%, -50%) scale(1.08);
            border-color: rgba(232, 201, 122, 0.6);
            background: rgba(20, 18, 35, 0.92);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 24px rgba(232, 201, 122, 0.25),
                0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .node:active {
            transform: translate(-50%, -50%) scale(0.96);
        }

        /* 键盘焦点：清晰的金色焦点环 */
        .node:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 3px;
        }

        .node .icon {
            font-size: 1.7rem;
            margin-bottom: 6px;
            display: block;
            filter: drop-shadow(0 0 6px rgba(232, 201, 122, 0.6));
        }

        .node .title {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 3px;
            letter-spacing: 0.5px;
        }

        .node .desc {
            font-size: 0.68rem;
            color: var(--text-sub);
            line-height: 1.4;
        }

        /* 节点顶部的紫色小旗（装饰） */
        .node::before {
            content: '';
            position: absolute; top: -10px; left: 50%;
            transform: translateX(-50%);
            width: 1.5px; height: 10px;
            background: var(--purple);
            opacity: 0.7;
            box-shadow: 0 0 6px var(--purple);
        }

        .node::after {
            content: '';
            position: absolute; top: -16px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 6px solid var(--purple);
            opacity: 0.7;
            filter: drop-shadow(0 0 4px var(--purple));
        }

        /* 标题 */
        .header-title {
            position: absolute; top: 24px; left: 24px; z-index: 10;
            font-size: 1.05rem;
            letter-spacing: 2px;
            color: var(--text-sub);
            pointer-events: none;
        }

        .header-title span {
            color: var(--gold);
            text-shadow: 0 0 8px rgba(232, 201, 122, 0.4);
        }

        /* ==========================================================
           移动端适配：小屏幕上节点适当缩小，避免拥挤
           ========================================================== */
        @media (max-width: 768px) {
            .node {
                width: 130px;
                padding: 10px 10px;
            }
            .node .icon { font-size: 1.3rem; margin-bottom: 4px; }
            .node .title { font-size: 0.8rem; }
            .node .desc { font-size: 0.6rem; }
            .header-title { font-size: 0.9rem; top: 16px; left: 16px; }
        }
    </style>
</head>
<body>

    <canvas id="star-canvas" aria-hidden="true"></canvas>

    <div id="app">
        <div class="header-title" aria-label="黄珈伦的个人导航"><span>黄珈伦</span>的个人导航</div>

        <svg id="rail-layer" aria-hidden="true">
            <defs>
                <linearGradient id="rail-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#e8c97a" />
                    <stop offset="100%" stop-color="#9d6ff0" />
                </linearGradient>
            </defs>
        </svg>

        <nav id="nodes-container" aria-label="导航节点"></nav>
    </div>

    <script>
        /* ==========================================================
           ★★★ 在这里配置你个人主页的真实模块！★★★

           每个节点有 6 个字段：
           1. id:    唯一名字（连线时用，不要重复）
           2. title: 模块名称（显示在卡片上的大字）
           3. desc:  一句话描述（显示在卡片上的小字）
           4. icon:  图标（Emoji）
           5. x, y:  节点在星图上的位置，百分比 0~100
           6. link:  跳转链接
                  a) "#id" → 跳回主站对应区块
                  b) "/" 或 "http" → 整页跳转
           ========================================================== */
        const navConfig = [
            { id: 'mod-home',     title: '出发站',   desc: '返回数字名片主页',   icon: '🚂',   x: 12, y: 50, link: '/card/' },
            { id: 'mod-about',    title: '关于',     desc: '了解我是谁',         icon: '👨‍🚀', x: 32, y: 28, link: '#about' },
            { id: 'mod-journey',  title: '足迹',     desc: '我的成长轨迹',       icon: '🗺️',  x: 48, y: 14, link: '#journey' },
            { id: 'mod-skills',   title: '技能',     desc: '我点亮的技能树',     icon: '⚡',   x: 64, y: 30, link: '#skills' },
            { id: 'mod-quests',   title: '兴趣',     desc: '正在折腾的事',       icon: '🛠️',  x: 78, y: 16, link: '#quests' },
            { id: 'mod-photos',   title: '相册',     desc: '定格的照片',         icon: '📷',   x: 86, y: 44, link: '#photos' },
            { id: 'mod-hobbies',  title: '爱好',     desc: '生活的调味剂',       icon: '🎮',   x: 76, y: 66, link: '#hobbies' },
            { id: 'mod-queue',    title: '清单',     desc: '想看想做的',         icon: '📝',   x: 56, y: 78, link: '#queue' },
            { id: 'mod-playlist', title: '歌单',     desc: '循环播放的歌',       icon: '🎵',   x: 34, y: 68, link: '#playlist' },
            { id: 'mod-figures',  title: '摆件收集', desc: '真的忍不住…钱包在哭泣', icon: '🧸', x: 14, y: 84, link: '#hobbies' }
        ];

        const edgesData = [
            { from: 'mod-home',     to: 'mod-about' },
            { from: 'mod-about',    to: 'mod-journey' },
            { from: 'mod-journey',  to: 'mod-skills' },
            { from: 'mod-skills',   to: 'mod-quests' },
            { from: 'mod-quests',   to: 'mod-photos' },
            { from: 'mod-photos',   to: 'mod-hobbies' },
            { from: 'mod-hobbies',  to: 'mod-queue' },
            { from: 'mod-queue',    to: 'mod-playlist' },
            { from: 'mod-playlist', to: 'mod-figures' }
        ];

        /* ==========================================================
           底层渲染逻辑
           ========================================================== */

        // 检查是否开启了「减弱动画」
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ---------- 1. Canvas 星空背景 ---------- */
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [], mouseX = 0, mouseY = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 生成星尘粒子
        const starCount = prefersReducedMotion ? 60 : 120;
        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.3 + 0.4,
                alpha: Math.random() * 0.4 + 0.4,
                speed: prefersReducedMotion ? 0 : Math.random() * 0.04 + 0.01,
                depth: Math.random() * 0.5 + 0.5
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                const offsetX = prefersReducedMotion ? 0 : (mouseX - window.innerWidth / 2) * star.depth * 0.015;
                const offsetY = prefersReducedMotion ? 0 : (mouseY - window.innerHeight / 2) * star.depth * 0.015;
                ctx.beginPath();
                ctx.arc(star.x + offsetX, star.y + offsetY, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(232, 236, 248, ${star.alpha})`;
                ctx.fill();
                star.y -= star.speed;
                if (star.y < 0) {
                    star.y = canvas.height;
                    star.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

        /* ---------- 2. 悬停音效 ---------- */
        let audioCtx = null;
        function playTing() {
            if (prefersReducedMotion) return;  // 减弱动画时也关闭音效
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1400, t);
                osc.frequency.exponentialRampToValueAtTime(800, t + 0.12);
                gain.gain.setValueAtTime(0.04, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.28);
            } catch (e) { /* 静默跳过 */ }
        }

        /* ---------- 3. 跳转逻辑 ---------- */
        function handleNavigation(link) {
            if (link.startsWith('#')) {
                const targetEl = document.querySelector(link);
                if (targetEl) {
                    targetEl.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth' });
                } else {
                    window.location.href = '/card/' + link;
                }
            } else {
                window.location.href = link;
            }
        }

        /* ---------- 4. 渲染节点与轨道 ---------- */
        const nodesContainer = document.getElementById('nodes-container');
        const railLayer = document.getElementById('rail-layer');
        let railPaths = [];
        let railOrbs = [];

        function renderNavigation() {
            nodesContainer.innerHTML = '';
            railLayer.querySelectorAll('path').forEach(p => p.remove());
            railLayer.querySelectorAll('.rail-orb').forEach(o => o.remove());
            railPaths = [];
            railOrbs = [];

            navConfig.forEach(node => {
                const el = document.createElement('div');
                el.className = 'node';
                el.id = node.id;
                el.setAttribute('role', 'link');
                el.setAttribute('tabindex', '0');
                el.setAttribute('aria-label', `${node.title}：${node.desc}`);
                el.style.left = `${node.x}%`;
                el.style.top = `${node.y}%`;
                el.innerHTML = `
                    <span class="icon" aria-hidden="true">${node.icon}</span>
                    <div class="title">${node.title}</div>
                    <div class="desc">${node.desc}</div>
                `;
                el.addEventListener('mouseenter', playTing);
                el.addEventListener('click', () => handleNavigation(node.link));
                // 键盘支持：回车或空格触发跳转
                el.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        handleNavigation(node.link);
                    }
                });
                nodesContainer.appendChild(el);
            });

            edgesData.forEach(edge => {
                const fromNode = navConfig.find(n => n.id === edge.from);
                const toNode = navConfig.find(n => n.id === edge.to);
                if (fromNode && toNode) {
                    const x1 = (fromNode.x / 100) * window.innerWidth;
                    const y1 = (fromNode.y / 100) * window.innerHeight;
                    const x2 = (toNode.x / 100) * window.innerWidth;
                    const y2 = (toNode.y / 100) * window.innerHeight;

                    const cx1 = x1 + (x2 - x1) * 0.4, cy1 = y1;
                    const cx2 = x2 - (x2 - x1) * 0.4, cy2 = y2;

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`);
                    path.setAttribute('class', 'rail-line');
                    railLayer.appendChild(path);
                    railPaths.push(path);

                    const orb = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    orb.setAttribute('r', '3.5');
                    orb.setAttribute('class', 'rail-orb');
                    orb.setAttribute('cx', x1);
                    orb.setAttribute('cy', y1);
                    railLayer.appendChild(orb);
                    railOrbs.push(orb);
                }
            });
        }

        /* ---------- 5. 光点沿轨道跑动 ---------- */
        function animateOrbs(ts) {
            if (prefersReducedMotion) return;  // 减弱动画：光点静止
            railPaths.forEach((path, i) => {
                if (!path.getTotalLength || !railOrbs[i]) return;
                const len = path.getTotalLength();
                const speed = 4000 + i * 900;
                const phase = i * 0.37;
                const progress = ((ts / speed) + phase) % 1;
                const pt = path.getPointAtLength(progress * len);
                railOrbs[i].setAttribute('cx', pt.x);
                railOrbs[i].setAttribute('cy', pt.y);
            });
            requestAnimationFrame(animateOrbs);
        }
        if (!prefersReducedMotion) {
            requestAnimationFrame(animateOrbs);
        }

        window.addEventListener('resize', renderNavigation);
        renderNavigation();
    </script>
</body>
</html>
